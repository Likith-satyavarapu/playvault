<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PlayVault">
<title>PlayVault Staff</title>
<style>
:root { --bg: #F2F5FB; --surface: #FFFFFF; --fg: #0E1629; --muted: #566178; --line: #D3DBEC; --accent: #2563EB; --accent-fg: #FFFFFF; --navy: #0B1426; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0A0F1E; --surface: #121A2E; --fg: #E8ECF6; --muted: #98A3BC; --line: #26314C; --accent: #6C9CFF; --accent-fg: #07101F; --navy: #060A15; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
.shell { height: 100%; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
.top { flex: none; background: var(--surface); border-bottom: 1px solid var(--line); padding: calc(8px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px)); }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 640px; margin: 0 auto; }
.tab { min-height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--bg); color: var(--muted); font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.frames { flex: 1; min-height: 0; position: relative; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
iframe[hidden] { display: none; }
</style>
</head>
<body>
<div class="shell">
  <div class="top"><div class="tabs" role="tablist" aria-label="PlayVault tools">
    <button class="tab" role="tab" data-t="agreement" id="tab-agreement">Agreement</button>
    <button class="tab" role="tab" data-t="booking" id="tab-booking">Booking</button>
    <button class="tab" role="tab" data-t="rewards" id="tab-rewards">Rewards</button>
  </div></div>
  <div class="frames">
    <iframe id="f-agreement" title="Rental agreement" hidden></iframe>
    <iframe id="f-booking" title="Booking confirmation" hidden></iframe>
    <iframe id="f-rewards" title="Rewards" hidden></iframe>
  </div>
</div>
<script>
(function () {
  var PAGES = { agreement: "agreement.html", booking: "booking.html", rewards: "rewards.html" };
  var KEY = "pv_staff_tab";
  function $(id) { return document.getElementById(id); }
  function show(name, params) {
    Object.keys(PAGES).forEach(function (k) {
      var on = k === name, f = $("f-" + k), t = $("tab-" + k);
      t.setAttribute("aria-selected", on ? "true" : "false");
      f.hidden = !on;
      if (on && (!f.getAttribute("src") || (k === "rewards" && params))) f.src = PAGES[k] + (k === "rewards" && params ? "?" + params : "");
    });
    try { localStorage.setItem(KEY, name); } catch (e) {}
  }
  document.querySelector(".tabs").addEventListener("click", function (e) { var b = e.target.closest("[data-t]"); if (b) show(b.getAttribute("data-t")); });
  window.addEventListener("message", function (e) {
    if (e.origin !== location.origin) return;
    var d = e.data;
    if (d && d.pv === "rewards" && typeof d.params === "string") show("rewards", d.params);
  });
  var start = "agreement";
  try { var s = localStorage.getItem(KEY); if (PAGES[s]) start = s; } catch (e) {}
  show(start);
})();
</script>
</body>
</html>
